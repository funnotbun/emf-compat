name: Tools

# Быстрая проверка тестового инструмента (tools/mctest). Java здесь не нужна:
# мод-драйвер живёт в отдельной Gradle-сборке и в CI намеренно не собирается —
# это девелоперский инструмент, а его сборка тянет всё Minecraft-окружение.

on:
  push:
    paths: ['tools/**', '.github/workflows/tools.yml']
  pull_request:
    paths: ['tools/**', '.github/workflows/tools.yml']
  workflow_dispatch:

concurrency:
  group: tools-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check tools/mctest --select F,E,W,I,UP,B,SIM --line-length 120

      - name: Syntax check
        run: python -m compileall -q tools/mctest
